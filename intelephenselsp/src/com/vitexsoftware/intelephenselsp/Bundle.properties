OpenIDE-Module-Name=Intelephense LSP for PHP
OpenIDE-Module-Short-Description=Registers Intelephense as a PHP language server
OpenIDE-Module-Long-Description=\
    Registers the Intelephense PHP Language Server (https://intelephense.com/) \
    with NetBeans' built-in generic LSP client, adding Intelephense-powered code \
    completion, hover and navigation for PHP files alongside NetBeans' native PHP \
    editor support. Requires "intelephense" to be installed and available on PATH \
    (npm i intelephense -g).
CTL_RestartAction=Restart Intelephense Language Server
